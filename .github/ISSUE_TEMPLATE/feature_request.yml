name: Feature request
description: Propose new behavior or a change to an existing surface.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current behavior does not allow it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Commands, API shapes, or outputs you would expect.
    validations:
      required: true
  - type: checkboxes
    id: surfaces
    attributes:
      label: Affected surfaces
      options:
        - label: CLI (`shinu`)
        - label: REST API
        - label: MCP (`shinu-mcp`)
        - label: Web console
        - label: Daemon internals (`shinud`)
        - label: Guest image
        - label: Packaging
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
