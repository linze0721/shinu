name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Lint policy lives in the workspace Cargo.toml; do not add lint args here.
      - run: cargo clippy --all-targets --workspace

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Hermetic: no root, KVM, btrfs, or network required.
      - run: cargo test --workspace
      - name: Sparse warm page-cache regression
        shell: bash
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d "$RUNNER_TEMP/shinu-warm.XXXXXX")
          export TMPDIR
          trap 'rm -rf -- "$TMPDIR"' EXIT
          case "$(findmnt --noheadings --output FSTYPE --target "$TMPDIR")" in
            ext4|xfs|btrfs) ;;
            *) echo 'Sparse warm test requires a disk-backed ext4, XFS or Btrfs TMPDIR' >&2; exit 1 ;;
          esac
          test_name=snapshot_memory::tests::warming_populates_data_pages_but_not_holes
          cargo test --color never -p shinu-vm --lib "$test_name" -- --ignored --exact | tee "$TMPDIR/test.log"
          # An exact filter that matches zero tests is otherwise a successful Cargo run.
          grep -Fx "test $test_name ... ok" "$TMPDIR/test.log"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # Release binaries are what packaging/install.sh expects.
      - run: cargo build --release --workspace
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl -p shinu-vm --bin shinu-snapshot-agent
      - name: Verify static guest snapshot helper
        run: |
          agent=target/x86_64-unknown-linux-musl/release/shinu-snapshot-agent
          format=$(LC_ALL=C file -b "$agent")
          case "$format" in
            'ELF '*'statically linked'*|'ELF '*'static-pie linked'*) ;;
            *) printf 'Expected a static guest helper, got: %s\n' "$format" >&2; exit 1 ;;
          esac
          capabilities=$(timeout 5 "$agent" --capabilities)
          printf '%s\n' "$capabilities"
          test "$capabilities" = 'SHINU-SNAPSHOT-1 READY-1'
