[package]
name = "shinu"
version = "0.1.0"
edition = "2024"

[lib]
name = "shinu"
path = "src/lib.rs"

[[bin]]
name = "shinu"
path = "src/bin/shinu.rs"

[[bin]]
name = "shinud"
path = "src/bin/shinud.rs"

[[bin]]
name = "shinu-vsock"
path = "src/bin/shinu-vsock.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
